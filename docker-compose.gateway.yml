services:
  gateway:
    build:
      context: .
      dockerfile: CeleCamIp.Gateway/Dockerfile
    container_name: celecamip-gateway
    restart: unless-stopped

    # host: el Gateway necesita llegar directo a las camaras de la LAN de
    # la casa (IPs tipo 192.168.x.x) sin que Docker le haga NAT/bridge en el
    # medio. En Linux (Raspberry Pi OS) esto funciona directo.
    network_mode: host

    environment:
      # --- Server (Hub central) ---
      - Server__HubUrl=${SERVER_HUB_URL}
      - Auth__ApiKey=${AUTH_API_KEY}

      # --- Identidad de esta casa ---
      - House__Id=${HOUSE_ID}
      - House__CameraIps__0=${CAMERA_IP_1}
      - House__CameraIps__1=${CAMERA_IP_2}
      - House__CameraIps__2=${CAMERA_IP_3}
      - House__CameraIps__3=${CAMERA_IP_4}
      - House__CameraUsername=${CAMERA_USERNAME}
      - House__CameraPassword=${CAMERA_PASSWORD}

      # --- TURN/STUN (WebRTC) ---
      - IceServers__0__Urls=turn:free.expressturn.com:3478
      - IceServers__0__Username=${TURN_USERNAME}
      - IceServers__0__Credential=${TURN_CREDENTIAL}
      - IceServers__1__Urls=stun:stun.l.google.com:19302
